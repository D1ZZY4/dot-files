# Directory segment.
[directory]
style = "fg:color_bg0 bg:color_purple"
format = "[ $path ]($style)"
truncation_length = 100
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " 󰌾"
read_only_style = "fg:color_red bg:color_purple"
home_symbol = ""

# Root directory: show a shield icon instead of / (regex anchored to the exact root path).
[[directory.substitutions]]
from = "^/$"
to = ""
regex = true

