# Git capsules.
# git_branch + git_commit form one teal capsule (branch name and short hash).
# git_state renders its own yellow capsule only while a rebase/merge/cherry-pick
# is in progress; it renders nothing otherwise.
# git_status renders colored glyphs with counts (no capsule).
[git_branch]
symbol = ""
style = "bg:color_teal fg:color_bg0"
format = "[@LEFT@](color_teal)[ $symbol $branch](fg:color_bg0 bg:color_teal)"
truncation_length = 32
truncation_symbol = "…"

[git_commit]
# Always show the short hash, not only in detached HEAD.
only_detached = false
commit_hash_length = 7
tag_disabled = true
format = "[ $hash ](fg:color_bg0 bg:color_teal)[@RIGHT@ ](fg:color_teal)"

[git_state]
format = "[@LEFT@](color_yellow)[ $state( $progress_current/$progress_total) ](fg:color_bg0 bg:color_yellow)[@RIGHT@ ](fg:color_yellow)"
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "APPLYING"
am_or_rebase = "REBASING"

[git_status]
# One color per status kind so staged/modified/deleted/etc. are distinguishable at a glance.
# Ahead/behind/diverged share the yellow ahead_behind variable (Starship has no
# separate $ahead / $behind format variables).
format = "[$conflicted](fg:color_red)[$typechanged](fg:color_yellow)[$staged](fg:color_green)[$modified](fg:color_yellow)[$deleted](fg:color_red)[$renamed](fg:color_blue)[$untracked](fg:color_sky)[$stashed](fg:color_purple)[$ahead_behind](fg:color_yellow)"
conflicted = "󰞇${count} "
typechanged = "~${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "󰏗${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "
up_to_date = ""
