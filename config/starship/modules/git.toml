# Git capsules.
[git_branch]
symbol = ""
style = "bg:moon_teal fg:moon_bg0"
format = "[@LEFT@](moon_teal)[ $symbol $branch $git_commit ](fg:moon_bg0 bg:moon_teal)[@RIGHT@ ](fg:moon_teal)"
truncation_length = 32
truncation_symbol = "…"

[git_status]
style = "fg:moon_teal"
format = "[$all_status$ahead_behind]($style)"
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "󰏗${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "
