# Dev Tools visibility for the Fastfetch startup block.
# Set a tool to false to hide it (for example: docker = false).
# Tools that are not installed are omitted regardless.
# Updated via: dot-files --dev-tools toggle <tool>

[runtimes]
nodejs = true
deno = true
bun = true
go = true
rustc = true
java = true

[packages]
npm = true
pnpm = true
yarn = true
cargo = true
pipx = true
uv = true

[python]
python = true

[system_tools]
git = true
gh = true

[infrastructure]
docker = true
compose = true
kubectl = true
